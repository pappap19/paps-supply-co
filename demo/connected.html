<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Connected — Pap's Supply Co Publisher</title>
<style>
body { font-family: Georgia, serif; max-width: 760px; margin: 48px auto;
       padding: 0 24px; color: #1c1c22; line-height: 1.6; background:#faf8f5; }
h1 { font-size: 2em; border-bottom: 2px solid #333; padding-bottom: 10px; }
.btn { display: inline-block; background: #1d7a3a; color: #fff; padding: 14px 28px;
       border-radius: 999px; text-decoration: none; font-size: 1.15em; }
.note { color: #555; font-size: 0.95em; }
</style>
</head>
<body>
<h1>Pap's Supply Co Publisher</h1>
<p>✅ Connected to Pinterest as <strong id="who">@…</strong> via OAuth 2.0.</p>
<p><a class="btn" href="/api/publish">Publish a product pin via the API</a></p>
<p class="note">This publishes one pin for a real Pap's Supply Co product
using the access token from the OAuth flow.</p>
<script>
  var m = document.cookie.match(/(?:^|; )pin_user=([^;]*)/);
  if (m) document.getElementById('who').textContent = '@' + decodeURIComponent(m[1]);
</script>
</body>
</html>
